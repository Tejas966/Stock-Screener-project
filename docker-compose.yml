# OPTIONAL: MySQL 8 in Docker, if you prefer not to install MySQL locally.
#   docker compose up -d
# Credentials must match DB_USER / DB_PASSWORD in your .env (development only).
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: change-me-root-password
      MYSQL_DATABASE: fundamentalx
      MYSQL_USER: fundamentalx
      MYSQL_PASSWORD: change-me-local-password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - fundamentalx-mysql:/var/lib/mysql
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
volumes:
  fundamentalx-mysql:
